## 📄 **.github/workflows/auto-commit.yml**
```yaml
name: Auto Commit
on:
schedule:
- cron: '0 */6 * * *'
workflow_dispatch:
permissions:
contents: write
jobs:
commit:
runs-on: ubuntu-latest
timeout-minutes: 10
steps:
- uses: actions/checkout@v4
with:
fetch-depth: 0


- name: Set up Node.js
- uses: actions/setup-node@v4
  with:
    node-version: 20



- run: npm install


- name: Run scraper
run: npm run scrape


- name: Commit and push changes
run: |
git config user.name 'github-actions'
git config user.email 'actions@github.com'
git add .
git commit -m "Auto scrape and commit" || echo "No changes to commit"
git push
```
