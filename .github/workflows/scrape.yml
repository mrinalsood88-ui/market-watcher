name: Auto Scrape & Commit

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Debug - show repo tree
        run: |
          pwd
          ls -la
          ls -R .

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: node run.js
