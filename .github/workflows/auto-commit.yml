name: Auto Scrape & Commit

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # run every 15 minutes
  push:
    branches: [ main ]

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (fetch all history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node (if your script needs it)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure we are on main
        run: |
          git checkout main

      - name: Fetch remote main and rebase
        run: |
          git fetch origin main
          git rebase origin/main || {
            echo "Rebase failed — attempting auto-resolve with merge";
            git rebase --abort || true;
            git merge --no-edit origin/main || true;
          }

      - name: Run scraper / generate data
        run: |
          chmod +x ./scripts/run-scraper.sh
          ./scripts/run-scraper.sh

      - name: Check for changes
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

      - name: Commit changes
        run: |
          git add -A
          git commit -m "chore(auto): update scraped data [skip ci]" || echo "Nothing to commit"

      - name: Push changes (with retry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git push origin HEAD:main || (
            echo "Push failed — fetching remote and rebasing then retrying"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git merge --no-edit origin/main || true; }
            git push origin HEAD:main
          )
